[project]
name = "dl-qpi"
version = "0.1.0"
description = "Reconstrucción de mapas de fase cuantitativa (QPI) para eritrocitos infectados con malaria"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "opencv-python>=4.8",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "kaggle>=1.5",
    "kagglehub>=0.2",
    "torch>=2.0",
    "torchvision>=0.15",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
